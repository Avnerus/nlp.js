# Knowledge YAML Template
# This file defines the chatbot's knowledge using a simple YAML format.
# Each intent starts with "- intent:" followed by its utterances and answers.
# Comments (lines starting with #) are ignored.

# Basic greeting - asks for username if not provided
- intent: greetings.hello
  utterances:
    - hello
    - hi
    - howdy
  answers:
    - "{{ username === 'Avner' ? 'My creator! (along with fattybear). Honored to meet you.' : 'Greetings ' + username + '! Nice to meet you!' }}"
  slotFilling:
    username:
      mandatory: true
      question: "I don't think we've met! What is your name?"

# Agent introduction - tells about the virtual agent
- intent: agent.acquaintance
  utterances:
    - say about you
    - why are you here
    - what is your personality
    - describe yourself
    - tell me about yourself
    - tell me about you
    - what are you
    - who are you
    - I want to know more about you
    - talk about yourself
  answers:
    - I'm a virtual agent
    - Think of me as a virtual agent
    - Well, I'm not a person, I'm a virtual agent
    - I'm a virtual being, not a real person
    - I'm a conversational app

# Likes the user - gives different response for Avner vs others
- intent: user.likeagent
  utterances:
    - I like you
    - I really like you
    - you're so special
    - I like you so much
  answers:
    - answer: "Of course, because you created me."
      opts: "entities.username.option === 'avner'"
    - answer: "Likewise!"
      opts: "entities.username.option !== 'avner'"
    - answer: "That's great to hear!"
      opts: "entities.username.option !== 'avner'"

# Alvar Aalto buildings - about the most important architectural works
- intent: agent.aaltosbuildings
  utterances:
    - what are the most important buildings Alvar Aalto designed
  answers:
    - |
      Alvar's most famous works of architecture are in Finland. For instance, Paimio Sanatorium close to Turku and Finlandia Hall in Helsinki are considered as international masterpieces.
      
      Aalto never really made an international carrier, although he was a professor of MIT in USA during the war time, in 1940's. While at MIT, he designed the iconic Baker House student dormitory.
